<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triport Properties | Real Estate & Land Investment Advisory</title>
  <meta name="description" content="Every Route Leads to Growth. Land and investment advisory across the Tirupati-Naidupeta Growth Corridor in Andhra Pradesh, India.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-sky': '#38BDF8',
            'brand-black': '#111111',
            'brand-brown': '#5C4033',
            'brand-dark': '#222222',
          },
          fontFamily: {
            sans: ['Poppins', 'Inter', 'sans-serif'],
            script: ['Caveat', 'cursive'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Poppins, Inter, Caveat (Matching Client Screenshot) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons & Babel for browser-direct execution -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Poppins', 'Inter', sans-serif; background-color: #ffffff; color: #222222; overflow-x: hidden; }
    .client-script-title { font-family: 'Caveat', cursive; letter-spacing: 0.5px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    @keyframes marquee-stream {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    .animate-marquee-stream {
      display: flex;
      width: max-content;
      animation: marquee-stream 45s linear infinite;
      will-change: transform;
    }
    .animate-marquee-stream:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Triport Full-Stack Standalone Application
    function App() {
      const [currentRoute, setCurrentRoute] = useState('home');
      const [modalOpen, setModalOpen] = useState(false);
      const [modalSubject, setModalSubject] = useState('General Enquiry');
      const [enquirySuccess, setEnquirySuccess] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Listen to URL Hash / Path changes (Supports direct /admin access)
      useEffect(() => {
        const handleHash = () => {
          if (window.location.pathname.startsWith('/admin')) {
            setCurrentRoute('admin');
            return;
          }
          const hash = window.location.hash.replace('#', '') || 'home';
          setCurrentRoute(hash);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        window.addEventListener('hashchange', handleHash);
        handleHash();
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigate = (route) => {
        window.location.hash = route;
        setMobileMenuOpen(false);
      };

      const openEnquiry = (subject = 'General Enquiry') => {
        setModalSubject(subject);
        setModalOpen(true);
      };

      const handleEnquirySubmit = (e) => {
        e.preventDefault();
        setEnquirySuccess(true);
        setTimeout(() => {
          setEnquirySuccess(false);
          setModalOpen(false);
        }, 2200);
      };

      return (
        <div className="min-h-screen flex flex-col bg-white">
          {/* 1. STICKY WHITE HEADER - ENLARGED & GENEROUS BREATHING ROOM */}
          <header className="sticky top-0 z-50 bg-white border-b border-zinc-200 py-3.5 sm:py-5 shadow-sm">
            <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 flex items-center justify-between">
              {/* Left: Prominent Logo with wide breathing gap to page buttons */}
              <div className="flex items-center">
                <a href="#home" className="flex items-center group py-1 mr-8 sm:mr-10 lg:mr-14 xl:mr-16 flex-shrink-0">
                  <img
                    src="./logo.png"
                    alt="Triport Properties"
                    className="h-16 sm:h-20 md:h-[88px] w-auto object-contain group-hover:scale-105 transition-transform drop-shadow-sm"
                  />
                </a>

                {/* Desktop Nav with 7 core pages */}
                <nav className="hidden lg:flex items-center space-x-2 xl:space-x-3">
                  {[
                    { name: 'Home', r: 'home' },
                    { name: 'About Us', r: 'about' },
                    { name: 'Services', r: 'services' },
                    { name: 'Projects', r: 'projects' },
                    { name: 'NRI Services', r: 'nri' },
                    { name: 'Contact Us', r: 'contact' }
                  ].map((item) => (
                    <button
                      key={item.r}
                      onClick={() => navigate(item.r)}
                      className={`px-3.5 py-2 rounded-lg text-sm font-semibold transition-all whitespace-nowrap ${
                        currentRoute === item.r ? 'bg-black text-white shadow-sm' : 'text-zinc-700 hover:bg-zinc-100 hover:text-[#38BDF8]'
                      }`}
                    >
                      {item.name}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Header CTA */}
              <div className="hidden sm:flex items-center space-x-3 flex-shrink-0 ml-4">
                <button
                  onClick={() => openEnquiry('Consultation Request')}
                  className="bg-black hover:bg-zinc-800 text-white px-5 py-2.5 rounded-full text-xs font-semibold shadow-md transition-all flex items-center space-x-1.5"
                >
                  <span className="w-2 h-2 rounded-full bg-[#38BDF8] animate-pulse"></span>
                  <span>Talk to an Advisor</span>
                </button>
              </div>

              {/* Mobile Hamburger */}
              <div className="lg:hidden flex items-center space-x-2">
                <button
                  onClick={() => openEnquiry('Advisor Call')}
                  className="bg-black text-white px-3 py-1.5 rounded-lg text-xs font-bold sm:hidden"
                >
                  Advisor
                </button>
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2 rounded-lg bg-zinc-900 text-white"
                >
                  ☰
                </button>
              </div>
            </div>

            {/* Mobile Drawer */}

              <div className="lg:hidden bg-white border-t border-zinc-200 px-4 py-3 space-y-1 shadow-xl">

                  { name: 'Home', r: 'home' },
                  { name: 'About Us', r: 'about' },
                  { name: 'Services', r: 'services' },
                  { name: 'Projects', r: 'projects' },
                  { name: 'Locations', r: 'locations' },
                  { name: 'NRI Services', r: 'nri' },
                  { name: 'Listings', r: 'listings' },
                  { name: 'Investment Guide', r: 'guide' },
                  { name: 'Corporate Land Bank', r: 'corporate' },
                  { name: 'Insights', r: 'insights' },
                  { name: 'Contact Us', r: 'contact' },
                  { name: 'Admin Portal', r: 'admin' }
                ].map((item) => (
                  <button
                    key={item.r}
                    onClick={() => navigate(item.r)}
                    className="block w-full text-left px-3 py-2 rounded-md font-semibold text-xs text-zinc-800 hover:bg-zinc-100"
                  >
                    {item.name}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* MAIN CONTENT ROUTING */}
          <main className="flex-1">
            {currentRoute === 'home' && <HomePage openEnquiry={openEnquiry} navigate={navigate} />}
            {currentRoute === 'about' && <AboutPage openEnquiry={openEnquiry} />}
            {currentRoute === 'services' && <ServicesPage openEnquiry={openEnquiry} />}
            {currentRoute === 'projects' && <ProjectsPage openEnquiry={openEnquiry} />}
            {currentRoute === 'locations' && <LocationsPage />}
            {currentRoute === 'nri' && <NRIPage openEnquiry={openEnquiry} />}
            {currentRoute === 'listings' && <ListingsPage openEnquiry={openEnquiry} />}
            {currentRoute === 'guide' && <GuidePage openEnquiry={openEnquiry} />}
            {currentRoute === 'corporate' && <CorporatePage openEnquiry={openEnquiry} />}
            {currentRoute === 'insights' && <InsightsPage />}
            {currentRoute === 'contact' && <ContactPage />}
            {currentRoute === 'admin' && <AdminPage />}
          </main>

          {/* RICH BROWN FOOTER */}
          <footer className="bg-[#5C4033] text-white pt-14 pb-8 border-t-4 border-[#38BDF8]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between pb-8 border-b border-[#7A5645] gap-4">
                <div>
                  <div className="mb-3">
                    <a href="#home" className="inline-block group py-1" title="Triport Properties">
                      <img src="./logo.png" alt="Triport Properties" className="h-14 sm:h-18 w-auto object-contain group-hover:scale-105 transition-transform drop-shadow-[0_0_1px_rgba(255,255,255,0.7)]" />
                    </a>
                  </div>
                  <p className="text-amber-200 text-sm mt-1 max-w-xl">Every Route Leads to Growth. Join the Growth Corridor.</p>
                </div>
                <div className="flex items-center gap-3">
                  <a
                    href="https://wa.me/919848012345"
                    target="_blank"
                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-full text-xs font-bold shadow"
                  >
                    WhatsApp Advisory
                  </a>
                  <button
                    onClick={() => navigate('contact')}
                    className="bg-[#38BDF8] text-black hover:bg-sky-300 px-5 py-2 rounded-full text-xs font-bold shadow"
                  >
                    Office Location
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 text-xs text-amber-100/90">
                <div>
                  <h4 className="font-bold text-[#38BDF8] uppercase tracking-wider mb-3">About Us</h4>
                  <p className="leading-relaxed">
                    Land investment advisory based on the Tirupati-Naidupeta growth corridor. Ground reality audits, verified layout sanctions, and clean title deeds.
                  </p>
                </div>
                <div>
                  <h4 className="font-bold text-[#38BDF8] uppercase tracking-wider mb-3">Land Options</h4>
                  <ul className="space-y-1.5">
                    <li><button onClick={() => navigate('services')} className="hover:underline">Residential Plots (TUDA)</button></li>
                    <li><button onClick={() => navigate('services')} className="hover:underline">Highway Commercial Plots</button></li>
                    <li><button onClick={() => navigate('services')} className="hover:underline">Fertile Farm Lands</button></li>
                    <li><button onClick={() => navigate('services')} className="hover:underline">Corporate Land Banks</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-bold text-[#38BDF8] uppercase tracking-wider mb-3">Growth Corridor</h4>
                  <ul className="space-y-1.5">
                    <li><button onClick={() => navigate('locations')} className="hover:underline">Tirupati Temple & Knowledge Hub</button></li>
                    <li><button onClick={() => navigate('locations')} className="hover:underline">Naidupeta-Tada Industrial Belt</button></li>
                    <li><button onClick={() => navigate('locations')} className="hover:underline">Tirupati Airport Expressway</button></li>
                    <li><button onClick={() => navigate('locations')} className="hover:underline">Krishnapatnam Port Feeder</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-bold text-[#38BDF8] uppercase tracking-wider mb-3">Advisory Desk</h4>
                  <p className="leading-relaxed">Triport Tower, 3rd Floor, Alipiri - Renigunta Bypass Road, Tirupati, AP - 517501.</p>
                  <p className="mt-2 font-bold text-white">Phone: +91 877 225 9988</p>
                </div>
              </div>

              <div className="pt-6 border-t border-[#7A5645] text-[11px] text-amber-200/70 space-y-2">
                <div className="p-3 bg-[#422D24] rounded-lg border border-[#7A5645] leading-relaxed">
                  <strong>Statutory Disclaimer:</strong> Information on this site is for general guidance only and is not an offer to sell. Buyers should verify title, approvals and documents independently and consult a qualified lawyer before purchase.
                </div>
                <div className="flex justify-between items-center pt-2">
                  <span>&copy; 2026 Triport Properties. All rights reserved.</span>
                  <div className="flex items-center space-x-4 text-[11px] text-amber-200/80">
                    <button onClick={() => navigate('about')} className="hover:underline">Privacy Policy</button>
                    <span>•</span>
                    <button onClick={() => navigate('about')} className="hover:underline">Terms of Use</button>
                  </div>
                </div>
              </div>
            </div>
          </footer>

          {/* FLOATING WHATSAPP BUTTON */}
          <aside aria-label="Contact options" className="fixed bottom-5 right-4 sm:bottom-6 sm:right-6 z-50 flex items-center group pointer-events-auto">
            <span className="hidden md:inline-block mr-3 px-3.5 py-1.5 bg-zinc-900/95 text-white text-xs font-semibold rounded-full shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none whitespace-nowrap border border-zinc-700">
              Chat on WhatsApp
            </span>
            <a
              href="https://wa.me/919848012345?text=Hello%20Triport%20Properties%20team,%20I%20am%20interested%20in%20land%20investment%20options."
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Direct WhatsApp Chat"
              className="relative flex items-center justify-center w-14 h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full shadow-2xl transition-all duration-300 hover:scale-110 active:scale-95 focus:outline-none"
            >
              <span className="absolute inset-0 rounded-full bg-[#25D366] opacity-75 animate-ping -z-10"></span>
              <svg viewBox="0 0 24 24" className="w-8 h-8 fill-current drop-shadow" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 6.46 17.5 2 12.04 2M12.05 20.16C10.57 20.16 9.12 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.8 7.37 7.5 3.67 12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.16 12.05 20.16M16.56 14.39C16.31 14.27 15.09 13.67 14.86 13.58C14.64 13.5 14.47 13.46 14.31 13.7C14.15 13.95 13.68 14.5 13.53 14.66C13.39 14.83 13.25 14.85 13 14.73C12.75 14.6 11.7 14.26 10.45 13.15C9.48 12.28 8.83 11.21 8.65 10.89C8.47 10.58 8.63 10.41 8.76 10.28C8.87 10.17 9.01 9.99 9.14 9.84C9.27 9.69 9.31 9.58 9.39 9.42C9.47 9.25 9.43 9.11 9.37 8.99C9.31 8.86 8.82 7.66 8.62 7.17C8.42 6.69 8.22 6.75 8.06 6.74C7.92 6.73 7.76 6.73 7.59 6.73C7.43 6.73 7.16 6.79 6.93 7.04C6.71 7.29 6.09 7.87 6.09 9.05C6.09 10.23 6.95 11.37 7.07 11.53C7.19 11.7 8.76 14.11 11.17 15.15C11.74 15.4 12.19 15.55 12.53 15.66C13.11 15.84 13.63 15.82 14.05 15.76C14.52 15.69 15.49 15.17 15.69 14.6C15.89 14.03 15.89 13.54 15.83 13.44C15.77 13.34 15.61 13.28 15.36 13.16Z" />
              </svg>
            </a>
          </aside>

          {/* ENQUIRY MODAL */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b">
                  <h3 className="font-bold text-base text-zinc-900">{modalSubject}</h3>
                  <button onClick={() => setModalOpen(false)} className="text-zinc-400 hover:text-black font-bold">✕</button>
                </div>

                {enquirySuccess ? (
                  <div className="py-8 text-center space-y-2">
                    <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                    <h4 className="font-bold text-base text-zinc-900">Enquiry Received!</h4>
                    <p className="text-xs text-zinc-500">Our senior advisor will call you on your phone/WhatsApp shortly.</p>
                  </div>
                ) : (
                  <form onSubmit={handleEnquirySubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-zinc-700 uppercase mb-1">Your Full Name *</label>
                      <input type="text" required placeholder="e.g. Anand Varma" className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold text-zinc-700 uppercase mb-1">Phone Number *</label>
                        <input type="tel" required placeholder="+91 98480 00000" className="w-full px-3 py-2 border rounded-xl" />
                      </div>
                      <div>
                        <label className="block font-bold text-zinc-700 uppercase mb-1">Email Address *</label>
                        <input type="email" required placeholder="you@example.com" className="w-full px-3 py-2 border rounded-xl" />
                      </div>
                    </div>
                    <div>
                      <label className="block font-bold text-zinc-700 uppercase mb-1">Property Interested In</label>
                      <select className="w-full px-3 py-2 border rounded-xl bg-white">
                        <option>Residential Plots (TUDA Approved)</option>
                        <option>Commercial Highway Plots</option>
                        <option>Open Plots for Investment</option>
                        <option>Fertile Farm Lands</option>
                        <option>Corporate Land Banks</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-zinc-700 uppercase mb-1">Requirements / Questions *</label>
                      <textarea required rows={3} placeholder="Tell us your budget and preferred corridor location..." className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <button type="submit" className="w-full bg-[#111111] hover:bg-zinc-800 text-white py-3 rounded-xl font-bold text-xs shadow-md">
                      Submit Consultation Request
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ======================== PAGE VIEWS ========================

    // 1. HOME PAGE WITH 5 DYNAMIC PROPERTY SLIDES
    function HomePage({ openEnquiry, navigate }) {
      const [currentSlide, setCurrentSlide] = useState(0);

      const heroSlides = [
        {
          id: 1,
          badge: "Tirupati – Naidupeta Growth Corridor Advisory",
          headline: "Every Route Leads to Growth",
          subheadline: "Strategic land and investment advisory across Andhra Pradesh's premier corridor connecting temple towns, 6-lane expressways, international airports, and industrial ports.",
          image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80",
          link: "projects",
          btnText: "Explore Land Options"
        },
        {
          id: 2,
          badge: "TUDA & DTCP Approved Gated Layouts",
          headline: "Secure Approved Residential Plots",
          subheadline: "Vetted residential plots in high-demand residential layouts close to educational institutions, healthcare hubs, and Tirupati International Airport with 100% clean legal titles.",
          image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80",
          link: "services",
          btnText: "Explore Residential Plots"
        },
        {
          id: 3,
          badge: "Naidupeta - Sullurpeta - Tada Belt",
          headline: "Industrial & Corporate Land Banks",
          subheadline: "Curated large-scale parcels for manufacturing, warehousing, and corporate expansions strategically situated along the Chennai-Kolkata NH-16 industrial corridor.",
          image: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80",
          link: "projects",
          btnText: "Corporate Land Banks"
        },
        {
          id: 4,
          badge: "Fertile Agricultural & Managed Agro Lands",
          headline: "High-Yield Farmland Investment",
          subheadline: "Fertile agricultural land with abundant groundwater, verified revenue records, and clear boundaries—perfect for weekend organic farming and capital appreciation.",
          image: "https://images.unsplash.com/photo-1500076656116-558758c991c1?auto=format&fit=crop&w=1920&q=80",
          link: "services",
          btnText: "Explore Farm Lands"
        },
        {
          id: 5,
          badge: "Port Connectivity & Coastal Trade Gateway",
          headline: "Coastal Trade & Port Corridor Lands",
          subheadline: "Direct access to Krishnapatnam, Dugarajapatnam, and Ramayapatnam deep-water ports driving industrial logistics and exponential commercial land appreciation.",

          link: "locations",
          btnText: "Corridor Connectivity"
        }
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentSlide((prev) => (prev + 1) % heroSlides.length);
        }, 3500);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="space-y-0">
          {/* 5-Slide Property Hero Carousel - Clear Images & Automatic Transitions */}
          <section className="relative min-h-[560px] sm:min-h-[640px] flex items-center justify-center bg-zinc-950 text-white text-center px-4 overflow-hidden select-none">
            {heroSlides.map((slide, idx) => (
              <div
                key={slide.id}
                className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${
                  currentSlide === idx ? 'opacity-100' : 'opacity-0 pointer-events-none'

              >
                <img
                  src={slide.image}
                  alt={slide.headline}
                  className="w-full h-full object-cover"
                />

            <div className="relative z-10 max-w-4xl mx-auto py-16 px-4 space-y-6">

              <h1 className="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight leading-tight drop-shadow-[0_4px_24px_rgba(0,0,0,1)]">
                {heroSlides[currentSlide].headline}

              <p className="text-base sm:text-xl text-white font-medium max-w-2xl mx-auto leading-relaxed drop-shadow-[0_2px_14px_rgba(0,0,0,1)]">
                {heroSlides[currentSlide].subheadline}
              </p>
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                <button
                  onClick={() => navigate(heroSlides[currentSlide].link)}
                  className="w-full sm:w-auto bg-[#38BDF8] hover:bg-sky-400 text-black px-8 py-3.5 rounded-full font-bold text-sm shadow-2xl transition-transform hover:scale-105"
                >
                  {heroSlides[currentSlide].btnText} &rarr;

                <button
